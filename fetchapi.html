<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API CRUD - Pizza Adatbázis</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <h1>Web programozás-1 Előadás Házi feladat</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Főoldal</a></li>
            <li><a href="javascript.html">JS CRUD</a></li>
            <li><a href="fetchapi.html" class="active">Fetch API</a></li>
            <li><a href="oojs.html">OOJS Grafika</a></li>
        </ul>
    </nav>

    <main class="crud-container">
        <section class="glass-card">
            <div class="card-header">
                <h2><i class="fas fa-database"></i> Fetch API CRUD</h2>
                <p>Adatok tárolása szerver oldali MySQL adatbázisban</p>
            </div>
            
            <form id="fetchPizzaForm" onsubmit="event.preventDefault(); handlePizzaSubmit()">
    <input type="hidden" id="fetchPizzaId">
    <div class="input-group">
        <input type="text" id="fetchPizzaName" placeholder="Pizza neve" required>
        
        <input type="text" id="fetchPizzaCategory" placeholder="Kategória (pl. lovag)" required>
        
        <div class="vega-check">
            <label for="fetchPizzaVega">Vegetáriánus?</label>
            <input type="checkbox" id="fetchPizzaVega">
        </div>

        <button type="submit" id="fetchSaveBtn" class="btn-main">
            <i class="fas fa-cloud-upload-alt"></i> Küldés a szerverre
        </button>
    </div>
</form>

<table class="crud-table">
    <thead>
        <tr>
            <th>Pizza Neve</th>
            <th>Kategória</th>
            <th>Vega?</th>
            <th>Műveletek</th>
        </tr>
    </thead>
    <tbody id="fetchPizzaBody">
        </tbody>
</table>
        </div>
    </main>

    <script src="fetch_crud.js"></script>
    <footer>
        <p>Készítők: Urbaniczki Hanna (JMNUMY) és Mladenovic Hermina (D4YO8S) </p>
    </footer>
</body>
</html>
